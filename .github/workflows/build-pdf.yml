name: Build PDF

on:
  push:
    paths:
      - 'paper1/docs/draft.md'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/extra:latest-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: |
          pandoc paper1/docs/draft.md \
            -o paper1/docs/paper.pdf \
            --from markdown \
            --template eisvogel \
            --pdf-engine xelatex \
            --number-sections \
            --metadata date="$(date +%Y-%m-%d)" \
            --metadata linkcolor=blue \
            --metadata codeblock-number-font="DejaVu Sans Mono"

      - name: Commit PDF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apt-get update -qq && apt-get install -y -qq git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add paper1/docs/paper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-build paper.pdf from draft.md [skip ci]"
            git push
          fi
