name: Build PDF

on:
  push:
    paths:
      - 'paper1/docs/draft.md'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pandoc/extra:latest-ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        run: |
          pandoc paper1/docs/draft.md \
            -o paper1/docs/paper.pdf \
            --from markdown \
            --template eisvogel \
            --pdf-engine xelatex \
            --number-sections \
            --metadata date="$(date +%Y-%m-%d)" \
            --metadata linkcolor=blue \
            --metadata codeblock-number-font="DejaVu Sans Mono"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper1/docs/paper.pdf
          retention-days: 1

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download PDF
        uses: actions/download-artifact@v4
        with:
          name: paper-pdf
          path: paper1/docs

      - name: Commit and push
        run: |
          git add paper1/docs/paper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-build paper.pdf from draft.md [skip ci]"
            git push
          fi
