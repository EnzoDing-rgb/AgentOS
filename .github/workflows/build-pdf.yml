name: Build PDF

on:
  push:
    paths:
      - 'paper1/docs/draft.md'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-latex-recommended

      - name: Install Eisvogel template
        run: |
          mkdir -p ~/.local/share/pandoc/templates
          curl -sL https://raw.githubusercontent.com/Wandmalfarbe/pandoc-latex-template/master/eisvogel.latex \
            -o ~/.local/share/pandoc/templates/eisvogel.latex

      - name: Build PDF
        run: |
          pandoc paper1/docs/draft.md \
            -o paper1/docs/paper.pdf \
            --from markdown \
            --template eisvogel \
            --pdf-engine xelatex \
            --number-sections \
            --metadata date="$(date +%Y-%m-%d)" \
            --metadata linkcolor=blue \
            --metadata codeblock-number-font="DejaVu Sans Mono"

      - name: Commit PDF
        run: |
          git add paper1/docs/paper.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, skip commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-build paper.pdf from draft.md [skip ci]"
            git push
          fi
