<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>BudgetFlow · Motion Reel</title>

<link rel="stylesheet" href="../shared/fonts.css">
<link rel="stylesheet" href="../shared/tokens.css">

  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a0a0a; }

</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Inlined engine: avoids file:// CORS on external .jsx; works with render-video.js file:// -->
<script type="text/babel" data-presets="react">
/**
 * animations.jsx — inlined for BudgetFlow reel
 */
(function() {
  const { createContext, useContext, useState, useEffect, useRef, useCallback } = React;

  const TimeContext = createContext({ time: 0, duration: 10, playing: false });
  const SpriteContext = createContext(null);

  const Easing = {
    linear: t => t,
    easeIn: t => t * t,
    easeOut: t => 1 - (1 - t) * (1 - t),
    easeInOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    expoOut: t => t === 1 ? 1 : 1 - Math.pow(2, -10 * t),
    overshoot: t => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    spring: t => {
      const c = (2 * Math.PI) / 3;
      return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c) + 1;
    },
    anticipation: t => {
      if (t < 0.2) return -0.3 * (t / 0.2) * (t / 0.2);
      const adjusted = (t - 0.2) / 0.8;
      return -0.012 + 1.012 * adjusted * adjusted * (3 - 2 * adjusted);
    },
  };

  function interpolate(t, input, output, easing) {
    const [inStart, inEnd] = input;
    const [outStart, outEnd] = output;
    if (t <= inStart) return outStart;
    if (t >= inEnd) return outEnd;
    let progress = (t - inStart) / (inEnd - inStart);
    if (easing) progress = easing(progress);
    return outStart + (outEnd - outStart) * progress;
  }

  function useTime() {
    const ctx = useContext(TimeContext);
    return ctx.time;
  }

  function useSprite() {
    const sprite = useContext(SpriteContext);
    if (!sprite) return { t: 0, elapsed: 0, duration: 0 };
    return sprite;
  }

  const stageStyles = {
    wrapper: { position: 'fixed', inset: 0, background: '#0a0a0a', display: 'flex', flexDirection: 'column', fontFamily: 'Inter, \"Noto Sans SC\", sans-serif' },
    stageHolder: { flex: 1, position: 'relative', overflow: 'hidden' },
    canvas: { position: 'absolute', top: '50%', left: '50%', transformOrigin: 'center center', background: '#f5f2ec', overflow: 'hidden' },
    controls: { position: 'fixed', bottom: 0, left: 0, right: 0, background: 'rgba(0, 0, 0, 0.82)', backdropFilter: 'blur(12px)', padding: '12px 20px', display: 'flex', alignItems: 'center', gap: 16, color: '#fff', fontSize: 12, zIndex: 100 },
    button: { background: 'none', border: '1px solid rgba(255,255,255,0.35)', color: '#fff', padding: '6px 14px', borderRadius: 4, cursor: 'pointer', fontSize: 12 },
    scrubber: { flex: 1, height: 4, background: 'rgba(255,255,255,0.2)', borderRadius: 2, position: 'relative', cursor: 'pointer' },
    scrubberFill: { position: 'absolute', top: 0, left: 0, height: '100%', background: '#1d7a8c', borderRadius: 2, pointerEvents: 'none' },
    scrubberHandle: { position: 'absolute', top: '50%', width: 12, height: 12, background: '#1d7a8c', borderRadius: '50%', transform: 'translate(-50%, -50%)', pointerEvents: 'none' },
  };

  function Stage({ duration = 10, width = 1920, height = 1080, loop = true, children, bgColor = '#f5f2ec' }) {
    const [time, setTime] = useState(0);
    const [playing, setPlaying] = useState(true);
    const [scale, setScale] = useState(1);
    const rafRef = useRef(null);
    const startTimeRef = useRef(performance.now());
    const canvasRef = useRef(null);
    const effectiveLoop = (typeof window !== 'undefined' && window.__recording) ? false : loop;

    useEffect(() => {
      function updateScale() {
        const vw = window.innerWidth;
        const vh = window.innerHeight - 56;
        const s = Math.min(vw / width, vh / height);
        setScale(s);
      }
      updateScale();
      window.addEventListener('resize', updateScale);
      return () => window.removeEventListener('resize', updateScale);
    }, [width, height]);

    useEffect(() => {
      if (!playing) return;
      let cancelled = false;
      let last = null;
      function tick(now) {
        if (cancelled) return;
        if (last === null) {
          last = now;
          if (typeof window !== 'undefined') window.__ready = true;
        }
        const delta = (now - last) / 1000;
        last = now;
        setTime(prev => {
          const next = prev + delta;
          if (next >= duration) return effectiveLoop ? 0 : duration - 0.001;
          return next;
        });
        rafRef.current = requestAnimationFrame(tick);
      }
      const startAfterFonts = () => { if (!cancelled) rafRef.current = requestAnimationFrame(tick); };
      if (typeof document !== 'undefined' && document.fonts && document.fonts.ready) {
        document.fonts.ready.then(startAfterFonts);
      } else startAfterFonts();
      return () => { cancelled = true; cancelAnimationFrame(rafRef.current); };
    }, [playing, duration, effectiveLoop]);

    const handleScrub = useCallback((e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      setTime(Math.max(0, Math.min(duration, ratio * duration)));
    }, [duration]);

    const handleSeek = useCallback((e) => { handleScrub(e); setPlaying(false); }, [handleScrub]);
    const progress = time / duration;
    const ctx = { time, duration, playing, setPlaying, setTime };
    const canvasStyle = { ...stageStyles.canvas, width, height, background: bgColor, transform: `translate(-50%, -50%) scale(${scale})` };

    return (
      <TimeContext.Provider value={ctx}>
        <div style={stageStyles.wrapper}>
          <div style={stageStyles.stageHolder}>
            <div ref={canvasRef} style={canvasStyle}>{children}</div>
          </div>
          <div className="no-record" style={stageStyles.controls} data-role="chrome">
            <button type="button" style={stageStyles.button} onClick={() => setPlaying(p => !p)}>{playing ? '⏸ 暂停' : '▶ 播放'}</button>
            <button type="button" style={stageStyles.button} onClick={() => setTime(0)}>⏮ 开始</button>
            <div style={{ fontFamily: 'JetBrains Mono, monospace', fontVariantNumeric: 'tabular-nums', minWidth: 90 }}>{time.toFixed(2)}s / {duration.toFixed(2)}s</div>
            <div style={stageStyles.scrubber} onMouseDown={handleSeek}>
              <div style={{ ...stageStyles.scrubberFill, width: `${progress * 100}%` }} />
              <div style={{ ...stageStyles.scrubberHandle, left: `${progress * 100}%` }} />
            </div>
          </div>
        </div>
      </TimeContext.Provider>
    );
  }

  function Sprite({ start = 0, end, children, style }) {
    const { time } = useContext(TimeContext);
    const actualEnd = end == null ? Infinity : end;
    if (time < start || time >= actualEnd) return null;
    const duration = actualEnd - start;
    const elapsed = time - start;
    const t = duration === 0 ? 1 : Math.max(0, Math.min(1, elapsed / duration));
    const spriteValue = { t, elapsed, duration, start, end: actualEnd };
    return (
      <SpriteContext.Provider value={spriteValue}>
        <div style={{ position: 'absolute', inset: 0, ...style }}>{children}</div>
      </SpriteContext.Provider>
    );
  }

  if (typeof window !== 'undefined') {
    window.Animations = { Stage, Sprite, useTime, useSprite, Easing, interpolate };
  }
})();
</script>

<script type="text/babel" data-presets="react">
const { Stage, Sprite, useSprite, Easing, interpolate } = window.Animations;

const INK = '#0e1b2c';
const MUTED = '#5a6573';
const ACCENT = '#1d7a8c';
const HAIR = '#b8bcc4';

function FadeBlock({ children, style }) {
  const { t } = useSprite();
  const o = interpolate(t, [0, 0.35], [0, 1], Easing.expoOut);
  const dy = interpolate(t, [0, 0.45], [28, 0], Easing.expoOut);
  return <div style={{ opacity: o, transform: `translateY(${dy}px)`, ...style }}>{children}</div>;
}

function LineAccent() {
  const { t } = useSprite();
  const w = interpolate(t, [0.15, 0.85], [0, 100], Easing.expoOut);
  return (
    <div style={{ marginTop: 24 }}>
      <div style={{ height: 4, width: `${w}%`, maxWidth: 420, background: ACCENT, borderRadius: 2 }} />
    </div>
  );
}

function PulseOrb() {
  const { t } = useSprite();
  const pulse = 0.85 + 0.15 * Math.sin(t * Math.PI * 6);
  return (
    <div style={{
      position: 'absolute', right: 100, top: '42%', width: 280, height: 280, borderRadius: '50%',
      background: `radial-gradient(circle at 30% 30%, rgba(29,122,140,0.35), transparent 55%)`,
      transform: `scale(${pulse})`, opacity: 0.9, pointerEvents: 'none',
    }} />
  );
}

function RqCard({ label, title, delay }) {
  const { t } = useSprite();
  const stagger = delay * 0.12;
  const o = interpolate(t, [stagger, stagger + 0.4], [0, 1], Easing.expoOut);
  const x = interpolate(t, [stagger, stagger + 0.45], [36, 0], Easing.expoOut);
  return (
    <div style={{
      opacity: o, transform: `translateX(${x}px)`,
      border: `1px solid ${HAIR}`, borderRadius: 6, padding: '22px 26px',
      background: 'rgba(255,255,255,0.72)', maxWidth: 520,
    }}>
      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: 11, letterSpacing: '0.1em', color: ACCENT, textTransform: 'uppercase', marginBottom: 8 }}>{label}</div>
      <div style={{ fontFamily: '\"Noto Serif SC\", serif', fontSize: 26, fontWeight: 700, color: INK, lineHeight: 1.35 }}>{title}</div>
    </div>
  );
}

function FlowStep({ n, text, x, active }) {
  const { t } = useSprite();
  const o = interpolate(t, [0.1 + n * 0.12, 0.35 + n * 0.12], [0, 1], Easing.expoOut);
  const sc = interpolate(t, [0.1 + n * 0.12, 0.4 + n * 0.12], [0.92, 1], Easing.expoOut);
  return (
    <div style={{ opacity: o, transform: `scale(${sc})`, textAlign: 'center', flex: 1, maxWidth: 340 }}>
      <div style={{
        width: 72, height: 72, margin: '0 auto 16px', borderRadius: '50%',
        border: `2px solid ${active ? ACCENT : HAIR}`, color: active ? ACCENT : MUTED,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'JetBrains Mono, monospace', fontSize: 22, fontWeight: 600, background: 'rgba(255,255,255,0.8)',
      }}>{n + 1}</div>
      <div style={{ fontSize: 20, color: INK, lineHeight: 1.45 }}>{text}</div>
    </div>
  );
}

function ArrowBetween() {
  const { t } = useSprite();
  const o = interpolate(t, [0.35, 0.55], [0, 1], Easing.linear);
  return <div style={{ opacity: o, padding: '0 8px', color: ACCENT, fontSize: 32, alignSelf: 'center' }}>→</div>;
}

function ReelApp() {
  const D = 22;
  return (
    <Stage duration={D} width={1920} height={1080} loop bgColor="#f5f2ec">
      <Sprite start={0} end={D}>
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: 'radial-gradient(ellipse 120% 70% at 50% -10%, rgba(14,27,44,0.06), transparent 50%)',
          pointerEvents: 'none',
        }} />
      </Sprite>

      <Sprite start={0} end={4.2}>
        <FadeBlock style={{ padding: '100px 120px' }}>
          <div style={{ fontFamily: 'JetBrains Mono', fontSize: 13, letterSpacing: '0.14em', color: ACCENT, textTransform: 'uppercase' }}>Paper 1 · Agent workflow</div>
          <h1 style={{ margin: '20px 0 0', fontFamily: '\"Noto Serif SC\", serif', fontWeight: 700, fontSize: 96, letterSpacing: '-0.03em', color: INK, lineHeight: 1.06 }}>BudgetFlow</h1>
          <p style={{ margin: '20px 0 0', fontSize: 30, color: MUTED, maxWidth: 920 }}>动态预算路由 · 并行 Agent 工作流</p>
          <LineAccent />
        </FadeBlock>
        <PulseOrb />
      </Sprite>

      <Sprite start={3.2} end={9}>
        <FadeBlock style={{ padding: '88px 120px 0' }}>
          <p style={{ fontFamily: '\"Noto Serif SC\", serif', fontSize: 38, fontWeight: 600, color: INK, lineHeight: 1.45, maxWidth: 1580 }}>
            当优化单位从「单次 LLM 调用」整条 agent workflow：<br /><span style={{ color: MUTED, fontSize: 32 }}>共享预算池 + 后端限流 + 并行推理</span>
          </p>
          <p style={{ marginTop: 28, fontSize: 24, color: ACCENT, fontFamily: 'JetBrains Mono' }}>→ 显式 workflow 状态能否在固定预算内改变成功率？</p>
        </FadeBlock>
      </Sprite>

      <Sprite start={7.8} end={14.5}>
        <div style={{ padding: '72px 120px', display: 'flex', flexDirection: 'column', gap: 20 }}>
          <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12, letterSpacing: '0.12em', color: MUTED, textTransform: 'uppercase', marginBottom: 8 }}>三个研究问题</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 24 }}>
            <RqCard delay={0} label="RQ1" title="工作流拓扑与预算分配的耦合" />
            <RqCard delay={1} label="RQ2" title="后端压力下的自适应路由策略" />
            <RqCard delay={2} label="RQ3" title="成功率与可审计轨迹的度量" />
          </div>
        </div>
      </Sprite>

      <Sprite start={13} end={19}>
        <FadeBlock style={{ padding: '100px 120px' }}>
          <div style={{ fontFamily: 'JetBrains Mono', fontSize: 12, letterSpacing: '0.12em', color: MUTED, textTransform: 'uppercase', marginBottom: 32 }}>系统叙事</div>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'center', gap: 0 }}>
            <FlowStep n={0} text="全局预算池与配额" />
            <ArrowBetween />
            <FlowStep n={1} text="动态路由器（BoPO-aware）" />
            <ArrowBetween />
            <FlowStep n={2} text="可复现轨迹与消融" />
          </div>
        </FadeBlock>
      </Sprite>

      <Sprite start={17.5} end={D}>
        <FadeBlock style={{ padding: '120px 120px', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', height: '100%', boxSizing: 'border-box' }}>
          <p style={{ fontFamily: '\"Noto Serif SC\", serif', fontWeight: 700, fontSize: 44, color: INK, margin: 0 }}>把 routing 视作一等系统对象</p>
          <p style={{ margin: '16px 0 0', fontSize: 26, color: MUTED }}>HTML deck · 本页导出 MP4 / GIF · Paper 2026</p>
          <div style={{ marginTop: 32, height: 5, width: 180, background: ACCENT, borderRadius: 2 }} />
        </FadeBlock>
      </Sprite>
    </Stage>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ReelApp />);
</script>
</body>
</html>
